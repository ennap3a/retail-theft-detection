[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-theft-detection"
version = "0.2.0"
description = "Human-in-the-loop retail security review assistant: YOLO tracking, pose, and zone logic for suspected-concealment alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.3",
    "lap>=0.5.12",
    "scikit-learn==1.9.1",
    "imageio-ffmpeg>=0.5",
    "streamlit>=1.50",
    "streamlit-image-coordinates>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
silentvision = ["tensorflow>=2.15"]

[tool.setuptools.packages.find]
include = ["retail_theft_detector*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
